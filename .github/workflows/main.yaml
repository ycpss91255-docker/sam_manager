name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Single job named `build` so main branch protection can require it
  # by name (gh api PUT .../branches/main/protection
  # required_status_checks.contexts=["build"]). Keep the name stable
  # across edits — renaming it breaks the protection rule.
  build:
    name: build
    runs-on: ubuntu-latest
    container:
      image: ros:humble-ros-base
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rosdep dependencies
        shell: bash
        run: |
          apt-get update
          rosdep update --rosdistro humble
          rosdep install --from-paths src --ignore-src -r -y

      - name: Install pip deps not in rosdep (structlog + pytest-cov)
        shell: bash
        run: |
          # ros:humble-ros-base ships without pip; install it first.
          # structlog + pytest-cov have no rosdep mapping on Ubuntu
          # 22.04 so we install via pip until the Layer 1 docker
          # scaffold can bake them into the image.
          apt-get install -y --no-install-recommends python3-pip
          python3 -m pip install structlog pytest-cov

      - name: colcon build sam_manager_msgs + sam_manager
        shell: bash
        run: |
          . /opt/ros/humble/setup.bash
          colcon build \
            --packages-select sam_manager_msgs sam_manager \
            --event-handlers console_direct+

      - name: ros2 interface show (smoke)
        shell: bash
        run: |
          . /opt/ros/humble/setup.bash
          . install/setup.bash
          ros2 interface show sam_manager_msgs/srv/SegmentFromReference
          ros2 interface show sam_manager_msgs/msg/MaskRLE

      - name: colcon test sam_manager
        shell: bash
        run: |
          . /opt/ros/humble/setup.bash
          . install/setup.bash
          colcon test \
            --packages-select sam_manager \
            --event-handlers console_direct+
          colcon test-result --verbose

      - name: pytest coverage (>= 80%)
        shell: bash
        run: |
          # colcon test runs pytest internally but doesn't expose
          # coverage. Re-run pytest with --cov against the installed
          # sam_manager module to enforce the line-coverage threshold
          # and surface a term-missing report in the CI log.
          . /opt/ros/humble/setup.bash
          . install/setup.bash
          python3 -m pytest \
            src/sam_manager/test/test_backend.py \
            src/sam_manager/test/test_mock.py \
            src/sam_manager/test/test_error_handler.py \
            --cov=sam_manager \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80
